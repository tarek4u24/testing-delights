global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'fastapi'
    static_configs:
      - targets: ['perf_api:8000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['perf_cadvisor:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['perf_postgres_exporter:9187']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'locust'
    static_configs:
      - targets: ['perf_locust_exporter:9646']
